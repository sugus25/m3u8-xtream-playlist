<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fullscreen Video - แยกหมวดหมู่</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #121212;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  header {
    background-color: #111;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    gap: 16px;
  }

  .running-text-container {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    height: 48px;
  }
  .running-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 15s linear infinite;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    line-height: 48px;
  }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  #videoContainer {
    width: 100%;
    max-width: 900px;
    margin: 20px auto;
    background: #000;
    padding: 10px;
    border-radius: 8px;
  }
  #videoPlayer {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
  }
  .input-area {
    margin: 10px 0;
    display: flex;
    gap: 8px;
  }
  .input-area input {
    flex: 1;
    padding: 8px;
    font-size: 14px;
    border-radius: 4px;
    border: none;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .button {
    cursor: pointer;
    padding: 8px 14px;
    border: none;
    background: #0f62fe;
    color: #fff;
    border-radius: 5px;
    transition: background 0.2s;
  }
  .button:hover { background: #005fcc; }

  /* === ส่วนหมวดหมู่ === */
  .category-tab {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
  }
  .category-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #444;
    background: #222;
    color: #ccc;
    cursor: pointer;
    transition: all 0.25s;
  }
  .category-btn:hover,
  .category-btn.active {
    background: #0f62fe;
    color: #fff;
    border-color: #0f62fe;
  }

  /* === รายการช่อง === */
  #channelList {
    width: 100%;
    max-width: 900px;
    margin: 0 auto 40px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    padding: 10px;
  }
  .channel-item {
    cursor: pointer;
    background: #222;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.25s ease;
  }
  .channel-item:hover,
  .channel-item.active {
    background-color: #0f62fe;
    transform: scale(1.03);
  }
  .channel-item img {
    width: 60px;
    height: 36px;
    object-fit: contain;
    border-radius: 4px;
  }
  .channel-name {
    font-size: 15px;
    font-weight: 600;
    color: #eee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ซ่อนกลุ่มที่ไม่ได้เลือก */
  .channel-group { display: contents; }
  .channel-group.hidden { display: none; }

  @media (max-width: 600px) {
    #channelList { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .channel-item img { width: 48px; height: 28px; }
    .channel-name { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="running-text-container">
    <div class="running-text">
      <script>
        const days = ['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'];
        const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        const t = new Date();
        document.write(`${days[t.getDay()]} ที่ ${t.getDate()} ${months[t.getMonth()]} พ.ศ. ${t.getFullYear()+543}`);
      </script> — เวลา: <span id="time"></span>
    </div>
  </div>
</header>

<script>
setInterval(()=>{
  document.getElementById("time").textContent = new Date().toLocaleTimeString('th-TH');
},1000);
</script>

<!-- เครื่องเล่นวิดีโอ -->
<div id="videoContainer">
  <video id="videoPlayer" controls></video>
  <div class="input-area">
    <input type="text" id="videoInput" placeholder="📋 วางลิงก์ .m3u8 หรือ URL วิดีโอ แล้วกด ▶ เล่น" />
    <button class="button" id="loadVideoBtn">▶ เล่น</button>
  </div>
  <div class="controls">
    <button class="button" id="stretch">Stretch</button>
    <button class="button" id="crop">Crop</button>
    <button class="button" id="zoom">Zoom</button>
    <button class="button" id="fullscreen">เต็มจอ</button>
  </div>
</div>

<!-- แถบเลือกหมวดหมู่ -->
<div class="category-tab" id="categoryTab">
  <button class="category-btn active" data-category="all">ทั้งหมด</button>
</div>

// === แปลงข้อมูล M3U ===
function parseM3U(data) {
  const lines = data.trim().split('\n');
  const channels = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith('#EXTINF')) {
      const infoLine = lines[i];
      const urlLine = (lines[i+1] || '').trim();
      const logoMatch = infoLine.match(/tvg-logo="([^"]+)"/);
      const groupMatch = infoLine.match(/group-title="([^"]+)"/);
      const nameMatch = infoLine.match(/,\s*(.*)$/);
      channels.push({
        name: nameMatch ? nameMatch[1].trim() : 'ไม่ระบุ',
        logo: logoMatch ? logoMatch[1] : '',
        group: groupMatch ? groupMatch[1].trim() : 'อื่นๆ',
        url: urlLine
      });
    }
  }
  return channels;
}

// === ตัวแปรหลัก ===
const channels = parseM3U(m3uData);
const videoPlayer = document.getElementById('videoPlayer');
const channelList = document.getElementById('channelList');
const categoryTab = document.getElementById('categoryTab');
let currentCategory = 'all';
let currentChannelIndex = -1;

// === จัดกลุ่มช่องตามหมวดหมู่ ===
const groups = {};
channels.forEach((ch, idx) => {
  if (!groups[ch.group]) groups[ch.group] = [];
  groups[ch.group].push({ ...ch, index: idx });
});

// === สร้างปุ่มหมวดหมู่ ===
Object.keys(groups).forEach(groupName => {
  const btn = document.createElement('button');
  btn.className = 'category-btn';
  btn.dataset.category = groupName;
  btn.textContent = groupName;
  btn.onclick = () => switchCategory(groupName);
  categoryTab.appendChild(btn);
});

// === เปลี่ยนหมวดหมู่ที่แสดง ===
function switchCategory(catName) {
  currentCategory = catName;
  // อัปเดตสถานะปุ่ม
  document.querySelectorAll('.category-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.category === catName);
  });
  // แสดง/ซ่อน กลุ่มช่อง
  document.querySelectorAll('.channel-group').forEach(grp => {
    grp.classList.toggle('hidden', catName !== 'all' && grp.dataset.group !== catName);
  });
}

// === สร้างรายการช่อง แยกตามกลุ่ม ===
Object.entries(groups).forEach(([groupName, items]) => {
  const groupDiv = document.createElement('div');
  groupDiv.className = 'channel-group';
  groupDiv.dataset.group = groupName;

  items.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'channel-item';
    div.setAttribute('tabindex', '0');
    div.setAttribute('role', 'button');
    div.setAttribute('aria-label', `ช่อง ${ch.name}`);
    div.innerHTML = `
      <img src="${ch.logo}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/60x36?text=📺'">
      <div class="channel-name">${ch.name}</div>
    `;
    div.onclick = () => selectChannel(ch.index, div);
    groupDiv.appendChild(div);
  });

  channelList.appendChild(groupDiv);
});

// === เล่นช่องที่เลือก ===
function selectChannel(index, element) {
  if (index < 0 || index >= channels.length) return;
  currentChannelIndex = index;
  const ch = channels[index];
  videoPlayer.src = ch.url;
  videoPlayer.play().catch(e => console.log('Autoplay blocked:', e));
  // ไฮไลต์
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');
}

// === ปุ่มควบคุมวิดีโอ ===
document.getElementById('loadVideoBtn').addEventListener('click', () => {
  const url = document.getElementById('videoInput').value.trim();
  if (!url) return alert('กรุณากรอก URL ก่อนครับ');
  videoPlayer.src = url;
  videoPlayer.play().catch(e => alert('ไม่สามารถเล่นได้: ' + e.message));
});

document.getElementById('stretch').onclick = () => videoPlayer.style.objectFit = 'fill';
document.getElementById('crop').onclick = () => videoPlayer.style.objectFit = 'cover';
document.getElementById('zoom').onclick = () => {
  videoPlayer.style.objectFit = (videoPlayer.style.objectFit === 'none') ? 'contain' : 'none';
};
document.getElementById('fullscreen').onclick = () => {
  if (videoPlayer.requestFullscreen) videoPlayer.requestFullscreen();
  else if (videoPlayer.webkitRequestFullscreen) videoPlayer.webkitRequestFullscreen();
};
</script>
